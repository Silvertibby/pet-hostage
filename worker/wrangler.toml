# Pet Hostage backend: one Worker + one KV namespace + an hourly cron for kidnapper nudges.
name = "pet-hostage"
main = "src/index.js"
compatibility_date = "2026-09-01"

kv_namespaces = [
  { binding = "PH", id = "f7bfe5cb41274d349aac0ad09866a306" }
]

[triggers]
crons = ["0 * * * *"]   # hourly (UTC); the worker checks the America/Vancouver hour itself

